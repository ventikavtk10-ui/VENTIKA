{% extends "base.html" %}
{% block content %}
<div style="max-width: 400px; margin: 40px auto; background: var(--card-bg); padding: 40px; border: 1px solid var(--border-color);">
    <div style="text-align: center; margin-bottom: 30px;">
        <span class="monogram">VTK</span>
        <h2 style="font-size: 20px; margin-top: 10px;">Acceso Administrador</h2>
    </div>
    <form method="POST">
        <div class="form-group">
            <label>Usuario</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn-gold" style="width: 100%; padding: 12px; margin-top: 10px;">Entrar al Panel</button>
    </form>
</div>
{% endblock %}
